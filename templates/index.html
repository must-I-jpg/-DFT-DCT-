<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图像频域水印生成</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <section class="workspace">
      <form class="panel controls" method="post" enctype="multipart/form-data">
        <div class="field">
          <label for="cover">载体图片</label>
          <input id="cover" name="cover" type="file" accept="image/*" required>
        </div>

        <div class="field">
          <label for="watermark">水印图片</label>
          <input id="watermark" name="watermark" type="file" accept="image/*" required>
        </div>

        <div class="field">
          <label for="method">水印算法</label>
          <select id="method" name="method">
            {% for value, label in methods.items() %}
              <option value="{{ value }}" {% if method == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
          <p class="hint" id="methodHint"></p>
        </div>

        <div class="field">
          <label for="alpha">嵌入强度</label>
          <div class="range-row">
            <input id="alpha" name="alpha" type="range" min="0.01" max="0.20" step="0.01" value="{{ alpha }}">
            <output id="alphaValue">{{ "%.2f"|format(alpha) }}</output>
          </div>
        </div>

        <button class="primary" type="submit">生成含水印图片</button>

        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}
      </form>

      <form class="shutdown-form" method="post" action="{{ url_for('shutdown') }}">
        <button class="shutdown" type="submit">退出应用</button>
      </form>

      <section class="panel result-panel">
        {% if result %}
          <div class="result-head">
            <div>
              <h1>生成结果</h1>
              <p>{{ method_name }} · PSNR {{ psnr }} dB · SSIM {{ ssim }} · 水印尺寸 {{ watermark_size }}</p>
            </div>
            <a class="download" href="{{ url_for('download', filename=download_name) }}">下载 PNG</a>
          </div>

          <div class="preview-grid">
            <figure>
              <img src="{{ cover_preview }}" alt="载体图片预览">
              <figcaption>载体图片</figcaption>
            </figure>
            <figure>
              <img src="{{ watermark_preview }}" alt="水印图片预览">
              <figcaption>二值化水印</figcaption>
            </figure>
            <figure class="wide">
              <img src="{{ result_preview }}" alt="含水印图片预览">
              <figcaption>含水印图片</figcaption>
            </figure>
          </div>
        {% else %}
          <div class="empty">
            <h1>图像频域水印生成</h1>
            <p>上传载体图和水印图，选择 DFT、DCT 或 DWT 算法，生成含水印图片。</p>
          </div>
        {% endif %}
      </section>
    </section>
  </main>

  <script>
    const alpha = document.getElementById("alpha");
    const alphaValue = document.getElementById("alphaValue");
    const method = document.getElementById("method");
    const methodHint = document.getElementById("methodHint");
    const hints = {
      dft: "在频谱对称区域嵌入水印，适合作为默认方案。",
      dct: "在 8 x 8 图像块的中频系数中进行 QIM 量化嵌入。",
      dwt: "在 Haar 小波细节分量中嵌入水印，修改集中在纹理区域。"
    };
    alpha.addEventListener("input", () => {
      alphaValue.textContent = Number(alpha.value).toFixed(2);
    });
    function updateMethodHint() {
      methodHint.textContent = hints[method.value];
    }
    method.addEventListener("change", updateMethodHint);
    updateMethodHint();
  </script>
</body>
</html>
